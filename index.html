<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal academic homepage">
  <title>Your Name</title>
  <style>
    body {
      max-width: 1050px;
      margin: 32px auto;
      padding: 0 22px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.55;
      color: #161616;
      background: #fff;
    }
    h1 { font-size: 2em; margin-top: 0; }
    h2 { margin-top: 1.5em; }
    a { color: #124ba0; }

      float: right;
      width: 225px;
      height: auto;
      margin: 0 0 30px 45px;
      border-radius: 2px;
    }
    li { margin-bottom: 14px; }
    @media (max-width: 620px) {
      body { margin: 18px auto; padding: 0 16px; }
      .portrait { width: 130px; margin: 0 0 15px 20px; }
    }
  </style>

<body>
  <!-- Uses your public GitHub profile picture initially.
       To use your own portrait, upload portrait.jpg and change src to "portrait.jpg". -->
